[package]
name = "voxel-traversal"
version = "0.4.0"
authors = [
    "Francis Engelmann (Original C Code)",
    "Christian Steenkamp (Port to Rust, Additions)"
]
edition = "2021"
description = "Traverse through all voxels in a 3d space from a start position to an end position."
readme = "README.md"
repository = "https://github.com/ChrisTechs/voxel-traversal"
license = "MIT"
keywords = ["voxel", "traversal", "raycast", "dda", "no_std"]

[features]
default = ["std"]
std = ["num-traits/std"]

glam = ["dep:glam"]
nalgebra = ["dep:nalgebra"]

[dependencies]
num-traits = { version = "0.2.0", default-features = false, features = ["libm"] }

glam = { version = "0.32.0", optional = true }
nalgebra = { version = "0.34.0", optional = true }